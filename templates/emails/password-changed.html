<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Your Deployer password was changed</title>
  </head>
  <body>
    <h1>Password changed</h1>
    <p>Hello {{ name }},</p>
    <p>
      Your Deployer password was changed. All previous sessions and reset links
      have been invalidated.
    </p>
    <p><a href="{{ link }}/console">Sign in to Deployer</a>.</p>
    <p>
      If you did not make this change, contact the administrator of this VPS
      immediately and secure your server and email account.
    </p>
  </body>
</html>
